schema_version: 1

context:
  name: django-tui
  version: "26.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_tui-${{ version }}.tar.gz
  sha256: ad4f0887be003ddb1daf7c2fbe9df6476c3dad3cbc6eff4259b685233b9d43fc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.8.0,<0.14.0
    - pip
  run:
    - python >=${{ python_min }}
    - django >=5.2
    - python-dotenv >=1.0
    - textual >=6.0

tests:
  - python:
      imports:
        - django_tui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Inspect and run Django Commands in a text-based user interface (TUI).
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/anze3db/django-tui

extra:
  recipe-maintainers:
    - thewchan
