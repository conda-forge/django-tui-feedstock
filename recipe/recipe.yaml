schema_version: 1

context:
  name: django-tui
  version: "26.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_tui-${{ version }}.tar.gz
  sha256: 3826013a4403903d24d42e2424cb06bac56d0d55b4675d84a17103cdadb36fe8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - django >=3.2
    - textual >=0.64.0
    - trogon

tests:
  - python:
      imports:
        - django_tui
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Inspect and run Django Commands in a text-based user interface (TUI).
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/anze3db/django-tui

extra:
  recipe-maintainers:
    - thewchan
