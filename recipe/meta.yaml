{% set name = "django-tui" %}
{% set version = "26.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/django_tui-{{ version }}.tar.gz
  sha256: 3826013a4403903d24d42e2424cb06bac56d0d55b4675d84a17103cdadb36fe8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - django >=3.2
    - textual >=0.64.0
    - trogon

test:
  imports:
    - django_tui
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/anze3db/django-tui
  summary: Inspect and run Django Commands in a text-based user interface (TUI).
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - thewchan
